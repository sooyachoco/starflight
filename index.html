<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Star Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dash-h: clamp(220px, 34vh, 330px);
    --win-h: calc(100vh - var(--dash-h));
    --stk: 124px;
    --text: #dbe7ff;
    --dim: #8ea3c6;
    --line: #22385a;
    --glass: rgba(10, 18, 34, .62);
    --teal: #3ee6c1;
    --blue: #4aa8ff;
    --amber: #ffb23e;
    --red: #ff5a5a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; background: #02040c; color: var(--text);
    font-family: Rajdhani, "Noto Sans KR", system-ui, sans-serif; user-select: none; }
  canvas#gl { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .glass { background: var(--glass); border: 1px solid #2a4064; border-radius: 10px;
    backdrop-filter: blur(6px); box-shadow: inset 0 1px 0 #ffffff12, 0 8px 24px #0006; }

  /* 창틀 */
  #frame { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--win-h) + 2px); }
  #frame .side { fill: rgba(4, 8, 16, .45); }
  #frame .strut { fill: url(#strutTex); }
  #frame .shade { fill: url(#strutShade); }
  #frame .edge { fill: none; stroke: #6b7891; stroke-opacity: .55; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  #canopy { position: absolute; left: 0; right: 0; top: 0; height: var(--win-h); pointer-events: none;
    background:
      linear-gradient(to top, rgba(255, 170, 70, .07), transparent 11%),
      linear-gradient(162deg, rgba(200, 220, 255, .07) 0%, transparent 26%),
      linear-gradient(198deg, rgba(200, 220, 255, .04) 0%, transparent 20%),
      radial-gradient(140% 120% at 50% 42%, transparent 62%, rgba(0, 0, 0, .5) 100%); }
  #frame .stripGlow { stroke: #ff9a2a55; stroke-width: 12; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  #frame .strip { stroke: #ffb54a; stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; }

  /* 상단 */
  #brand { position: absolute; top: 18px; left: 24px; display: flex; align-items: center; gap: 12px;
    font-weight: 600; font-size: 17px; letter-spacing: .14em; color: #e9f1ff; }
  #brand svg { width: 34px; height: 24px; }
  #brand i { width: 1px; height: 18px; background: #ffffff40; margin: 0 6px; }
  #brand .mode { color: var(--dim); }
  #speedBox { position: absolute; top: 62px; left: 24px; width: 150px; padding: 12px 16px 12px 20px; }
  .lbl { font-size: 14px; font-weight: 600; letter-spacing: .1em; color: #c9d7f0; }
  #spd { font-size: 46px; font-weight: 700; line-height: 1; margin-top: 4px; color: #fff; font-variant-numeric: tabular-nums; }
  .unit { font-size: 15px; color: var(--dim); margin-top: 2px; }
  .vbar { position: absolute; right: 16px; top: 16px; bottom: 16px; width: 8px; border-radius: 4px;
    background: #ffffff14; border: 1px solid #ffffff22; overflow: hidden; }
  .vbar i { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(#7ff7de, var(--teal)); }
  #btns { position: absolute; top: 16px; right: 22px; display: flex; gap: 10px; pointer-events: auto; }
  #btns button { width: 44px; height: 44px; border-radius: 9px; color: #fff; cursor: pointer;
    display: grid; place-items: center; padding: 0; }
  #btns button:hover { border-color: #5a7cb0; }
  #btns svg { width: 20px; height: 20px; }
  #obj { position: absolute; top: 74px; right: 22px; width: 270px; padding: 14px 18px; }
  #obj .oh { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; letter-spacing: .06em;
    color: var(--amber); padding-bottom: 10px; border-bottom: 1px solid #ffffff14; margin-bottom: 8px; }
  #obj .oh svg { width: 22px; height: 22px; flex: none; }
  .oi { display: flex; align-items: center; gap: 12px; font-family: "Noto Sans KR", sans-serif; font-size: 13.5px;
    color: #dfe8fa; padding: 5px 0; }
  .oi em { margin-left: auto; font-style: normal; font-family: Rajdhani; font-weight: 600; font-size: 15px; color: var(--dim); }
  .ck { width: 14px; height: 14px; border: 1.5px solid #c9d7f0; border-radius: 50%; flex: none; position: relative; }
  .oi.done { color: var(--dim); text-decoration: line-through; }
  .oi.done .ck { background: var(--teal); border-color: var(--teal); }
  .oi.done .ck::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
    border: solid #04121a; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  /* 조준선 & 타깃 */
  #reticle { position: absolute; left: 50%; top: calc(var(--win-h) / 2); width: 640px; height: 100px;
    margin: -50px 0 0 -320px; }
  #stn, #tgt { position: absolute; display: none; }
  #stn { transform: translate(-50%, -50%); color: var(--amber); text-align: center; font-weight: 600; font-size: 17px; }
  #stn svg { width: 22px; height: 22px; display: block; margin: 0 auto 2px; }
  #tgt { transform: translate(-50%, -50%); }
  #tgt .c { position: absolute; width: 18px; height: 18px; border: 0 solid currentColor; }
  #tgt .c1 { left: 0; top: 0; border-width: 2px 0 0 2px; }
  #tgt .c2 { right: 0; top: 0; border-width: 2px 2px 0 0; }
  #tgt .c3 { left: 0; bottom: 0; border-width: 0 0 2px 2px; }
  #tgt .c4 { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
  #tgt .tl2 { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px;
    white-space: nowrap; font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 6px; }
  #tgt .tl2 svg { width: 18px; height: 18px; }
  #edge { position: absolute; display: none; width: 0; height: 0; margin: -11px 0 0 -9px;
    border-left: 18px solid var(--amber); border-top: 11px solid transparent; border-bottom: 11px solid transparent;
    filter: drop-shadow(0 0 6px #ffb23e); }
  #toast { position: absolute; left: 50%; top: calc(var(--win-h) * .3); transform: translate(-50%, -50%);
    font-size: 28px; font-weight: 700; letter-spacing: .08em; opacity: 0; white-space: nowrap; }
  #toast.show { animation: pop 1.3s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%); } 12% { opacity: 1; transform: translate(-50%, -50%); }
    75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
  #warpfx { position: absolute; left: 0; right: 0; top: 0; height: var(--win-h); opacity: 0; mix-blend-mode: screen;
    background:
      radial-gradient(circle at 50% 50%, rgba(190, 225, 255, .45) 0%, rgba(120, 180, 255, .12) 9%, transparent 22%),
      radial-gradient(ellipse 75% 85% at 50% 50%, transparent 45%, rgba(40, 120, 255, .28) 75%, rgba(130, 70, 255, .55) 100%); }
  #warpflash { position: absolute; left: 0; right: 0; top: 0; height: var(--win-h); opacity: 0;
    background: radial-gradient(circle at 50% 50%, #ffffff 0%, #9fd0ff 30%, rgba(80, 120, 255, .4) 60%, transparent 85%); }
  #flash { position: absolute; inset: 0; background: radial-gradient(transparent 45%, #ff2040aa); opacity: 0; }

  /* 대시보드 */
  #dash { position: absolute; left: 0; right: 0; bottom: 0; height: var(--dash-h); background-color: #07090e;
    background-image: linear-gradient(180deg, rgba(8, 11, 18, .05) 0%, rgba(3, 5, 9, .45) 100%), url(assets/dash-metal.webp);
    background-size: auto, max(100%, 1300px) auto; background-position: 0 0, center 38%;
    box-shadow: 0 -18px 40px #000d; }
  #dash::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46px; pointer-events: none;
    background: linear-gradient(rgba(0, 0, 0, .72), transparent); }
  #dash .lip { position: absolute; left: -2px; right: -2px; top: -18px; height: 24px; border-radius: 16px 16px 0 0;
    background-color: #0c0e13;
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .13) 0, rgba(255, 255, 255, .03) 22%, transparent 45%, rgba(0, 0, 0, .55) 100%),
      url(assets/carbon.webp);
    background-size: auto, 160px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 8px 14px rgba(0, 0, 0, .75), 0 -1px 0 #000; }
  #dash .lip::before, #dash .lip::after { content: ""; position: absolute; top: 9px; width: 26px; height: 4px; border-radius: 2px;
    background: linear-gradient(#ffe2a8, #ff9e2a); box-shadow: 0 0 10px #ff9e2a, 0 0 2px #fff4; }
  #dash .lip::before { left: calc(50% - 160px); } #dash .lip::after { right: calc(50% - 160px); }
  .dgrid { position: absolute; top: 22px; bottom: 54px; left: max(2vw, calc((100% - 1520px) / 2));
    right: max(2vw, calc((100% - 1520px) / 2)); display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr) minmax(0, 1.45fr) minmax(0, .72fr); gap: 18px; }
  .scr { position: relative; border-radius: 14px; overflow: hidden; border: 10px solid transparent;
    background:
      radial-gradient(120% 95% at 50% 0%, #0c1a31, #050a15 72%) padding-box,
      radial-gradient(circle, #b9c1cd 0 1.2px, #59606c 1.8px, #1b1f27 2.7px, transparent 3.3px) left top / 10px 10px no-repeat border-box,
      radial-gradient(circle, #b9c1cd 0 1.2px, #59606c 1.8px, #1b1f27 2.7px, transparent 3.3px) right top / 10px 10px no-repeat border-box,
      radial-gradient(circle, #b9c1cd 0 1.2px, #59606c 1.8px, #1b1f27 2.7px, transparent 3.3px) left bottom / 10px 10px no-repeat border-box,
      radial-gradient(circle, #b9c1cd 0 1.2px, #59606c 1.8px, #1b1f27 2.7px, transparent 3.3px) right bottom / 10px 10px no-repeat border-box,
      linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .02) 12%, rgba(0, 0, 0, .1) 60%, rgba(0, 0, 0, .55)) border-box,
      url(assets/bezel.webp) center / cover border-box;
    box-shadow: inset 0 0 26px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(110, 170, 255, .2),
      0 0 0 1px #000, 0 1px 0 1px rgba(255, 255, 255, .06), 0 12px 22px rgba(0, 0, 0, .7); }
  .scr::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 4px;
    background:
      linear-gradient(116deg, rgba(220, 235, 255, .085) 0%, rgba(220, 235, 255, .03) 33%, transparent 33.3%),
      radial-gradient(130% 110% at 50% 45%, transparent 55%, rgba(0, 0, 0, .5) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .17) 0 1px, transparent 1px 3px); }
  .scr canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sl { position: absolute; top: 10px; left: 16px; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: #b9c9e6; z-index: 1; }
  .sr { position: absolute; top: 10px; right: 16px; font-size: 13px; font-weight: 600; color: var(--dim); z-index: 1; }
  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .g { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .g .gl { font-size: 14px; font-weight: 600; letter-spacing: .12em; color: #d2def3; }
  .g svg { width: min(80%, 13vh); aspect-ratio: 1; }
  .g .bg { fill: none; stroke: #ffffff12; stroke-width: 7; }
  .g .fg { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 251.3; transform: rotate(-90deg);
    transform-origin: 50% 50%; transition: stroke-dashoffset .3s, stroke .3s; }
  .g .ico { fill: #8193ad; }
  .g .ico.line { fill: none; stroke: #c9d6ea; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .g b { font-size: clamp(18px, 2.6vh, 26px); font-weight: 600; font-variant-numeric: tabular-nums; }
  .eng { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 34px 14px 14px 18px; gap: 10px; }
  .lever { position: relative; height: 100%; min-height: 90px; width: 100%; max-width: 92px; justify-self: center;
    background: linear-gradient(90deg, #05070b, #121620 50%, #05070b); border: 1px solid #000; border-radius: 7px;
    box-shadow: inset 0 3px 8px #000, inset 0 0 0 1px #262e3d, 0 1px 0 rgba(255, 255, 255, .06); }
  .lever::after { content: ""; position: absolute; top: 12px; bottom: 12px; right: 4px; width: 6px; opacity: .55;
    background: repeating-linear-gradient(180deg, #8ea3c6 0 1px, transparent 1px 10%); }
  .lever .slot { position: absolute; top: 12px; bottom: 12px; width: 8px; background: #000; border-radius: 4px;
    box-shadow: inset 0 0 4px #000, 0 0 0 1px #1d2533, 0 1px 0 1px rgba(255, 255, 255, .05); }
  .lever .slot:nth-child(1) { left: 34%; } .lever .slot:nth-child(2) { right: 34%; }
  #handle { position: absolute; left: 5%; right: 5%; height: 26px; border-radius: 7px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .38) 0, rgba(255, 255, 255, .06) 22%, transparent 50%, rgba(0, 0, 0, .55) 100%),
      repeating-linear-gradient(90deg, #444b58 0 2px, #1e222b 2px 4px);
    box-shadow: inset 5px 0 0 var(--amber), inset -5px 0 0 var(--amber), 0 0 12px #ffb23e55, 0 7px 10px #000, 0 2px 0 #000; }
  .modes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: space-between;
    height: 100%; min-height: 90px; font-size: 13px; font-weight: 600; letter-spacing: .1em; color: #6f82a3; }
  .modes li { display: flex; align-items: center; gap: 8px; }
  .modes li::before { content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a5670, #1a2131 70%); box-shadow: 0 0 0 1px #000, 0 1px 0 1px rgba(255, 255, 255, .06); }
  .modes li.on { color: #ffd59a; }
  .modes li.on::before { background: radial-gradient(circle at 35% 30%, #fff3d6, #ffb23e 45%, #c46a00);
    box-shadow: 0 0 0 1px #000, 0 0 10px var(--amber); }
  .keys { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center;
    padding: 5px 16px; border-radius: 8px; background: rgba(0, 0, 0, .55);
    box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255, 255, 255, .07);
    gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .1em; color: #b9c7de; white-space: nowrap; }
  .keys kbd { min-width: 22px; height: 24px; padding: 0 5px; box-sizing: border-box; display: inline-grid; place-items: center;
    border: 1.5px solid #c9d6ea; border-radius: 5px; font-family: inherit; font-size: 13px; color: #fff; }
  .keys span { margin: 0 6px 0 4px; }
  .keys i { width: 1px; height: 20px; background: #ffffff30; margin: 0 8px; }

  /* 오버레이 */
  #overlay { position: fixed; left: 0; right: 0; top: 0; height: var(--win-h); display: flex; align-items: center;
    justify-content: center; background: radial-gradient(#0009, #000a); cursor: pointer; pointer-events: auto; }
  #overlay.hidden { display: none; }
  .card { touch-action: pan-y; text-align: center; padding: 26px 34px; max-width: 560px; max-height: calc(var(--win-h) - 40px); overflow: auto;
    box-sizing: border-box; font-family: "Noto Sans KR", sans-serif; }
  .card h1 { font-family: Rajdhani; font-size: 46px; letter-spacing: .2em; margin: 0; color: #fff; }
  .card h2 { font-family: Rajdhani; font-weight: 600; font-size: 18px; letter-spacing: .14em; margin: 4px 0 16px; color: var(--amber); }
  .card p { font-size: 14px; line-height: 1.7; color: #c9d6ea; margin: 8px 0; }
  .card .stats { display: flex; justify-content: center; gap: 26px; margin: 14px 0; font-family: Rajdhani; }
  .card .stats div { font-size: 13px; letter-spacing: .1em; color: var(--dim); }
  .card .stats b { display: block; font-size: 28px; color: #fff; }
  .card .kgrid { display: grid; grid-template-columns: auto auto; gap: 6px 18px; text-align: left; width: max-content;
    margin: 14px auto; font-size: 13px; }
  .card kbd { border: 1px solid #ffffff44; border-radius: 4px; padding: 0 6px; font-family: Rajdhani; font-size: 13px; background: #ffffff10; }
  .card .go { margin-top: 16px; font-family: Rajdhani; font-weight: 700; font-size: 18px; letter-spacing: .16em; color: var(--teal);
    animation: blink 1.4s infinite; }
  .card button { font-family: inherit; font-size: 14px; color: #fff; background: #ffffff10; border: 1px solid #ffffff33;
    border-radius: 8px; padding: 9px 18px; margin: 6px; cursor: pointer; }
  .card button:hover { background: #ffffff1c; }
  @keyframes blink { 50% { opacity: .35; } }
  /* 전투 */
  #wpn { position: absolute; top: 206px; left: 24px; width: 150px; padding: 10px 16px 12px 20px; }
  #wpn .row { display: flex; justify-content: space-between; align-items: baseline; }
  #wpnS { font-size: 13px; font-weight: 700; letter-spacing: .1em; }
  .hbar { height: 6px; margin-top: 8px; border-radius: 3px; background: #ffffff14; overflow: hidden; }
  .hbar i { display: block; height: 100%; width: 0; border-radius: 3px; }
  .oi.kill { color: #ffd0d4; }
  .kx { width: 14px; height: 14px; flex: none; display: grid; place-items: center; color: #ff5a6a; font-size: 13px; font-weight: 700; }
  .oi.kill em { color: #ff8a96; }
  .emk { position: absolute; display: none; color: #ff4a5a; pointer-events: none; }
  .emk .c { position: absolute; width: 8px; height: 8px; border: 0 solid currentColor; }
  .emk .c1 { left: 0; top: 0; border-width: 2px 0 0 2px; } .emk .c2 { right: 0; top: 0; border-width: 2px 2px 0 0; }
  .emk .c3 { left: 0; bottom: 0; border-width: 0 0 2px 2px; } .emk .c4 { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
  .emk .d { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 4px;
    font-size: 13px; font-weight: 600; white-space: nowrap; }
  .emk .hp { position: absolute; top: 100%; left: 0; right: 0; margin-top: 5px; height: 3px; background: #ff4a5a33; }
  .emk .hp i { display: block; height: 100%; width: 100%; background: #ff4a5a; }
  .emk.off .c, .emk.off .d, .emk.off .hp { display: none; }
  .emk.off::after { content: ""; position: absolute; left: -7px; top: -7px; border-left: 13px solid #ff4a5a;
    border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  #lead { position: absolute; display: none; width: 14px; height: 14px; margin: -8px 0 0 -8px; border: 1.5px solid #ff6a78;
    border-radius: 50%; }
  #lead::after { content: ""; position: absolute; left: 5px; top: 5px; width: 4px; height: 4px; border-radius: 50%; background: #ff6a78; }
  #hitm { position: absolute; left: 50%; top: calc(var(--win-h) / 2); width: 44px; height: 44px; margin: -22px 0 0 -22px; opacity: 0; }

  /* 기체 선택 화면 */
  #select { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; box-sizing: border-box;
    padding: 24px clamp(16px, 3vw, 44px) 24px; background: #02040c; overflow: hidden; color: var(--text); }
  #select.hidden { display: none; }
  .sel-bg { position: absolute; inset: -30px; z-index: -1; background: url(assets/hangar-bg.webp) center / cover; }
  .sel-bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #02040c88, #02040c22 35%, #02040c55 70%, #02040cdd); }
  .sel-brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; letter-spacing: .14em; }
  .sel-brand svg { width: 38px; height: 26px; }
  .sel-brand i { width: 1px; height: 18px; background: #ffffff40; margin-left: 8px; }
  #select h1 { margin: 10px 0 0; font-size: clamp(30px, 3.4vw, 46px); font-weight: 700; letter-spacing: .03em; color: #fff; line-height: 1; }
  #select .sub { margin: 6px 0 0; font-size: 20px; font-weight: 500; color: #d6e2f7; letter-spacing: .04em; }
  #selSound { position: absolute; top: 18px; right: clamp(16px, 2vw, 30px); width: 46px; height: 46px; border-radius: 9px;
    display: grid; place-items: center; cursor: pointer; color: #fff; padding: 0; }
  #selSound.muted svg { opacity: .35; }
  #selSound svg { width: 22px; height: 22px; }
  .sel-cards { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(14px, 2vw, 30px); margin: 34px 0 22px; }
  .ship-card { position: relative; display: flex; flex-direction: column; min-height: 0; cursor: pointer;
    border: 2px solid #2a5fb4; border-radius: 14px; background: #050d1ce6;
    box-shadow: 0 0 0 1px #0a1730, inset 0 0 40px #0a2a5a40; transition: transform .25s, border-color .25s, box-shadow .25s; }
  .ship-card:hover { border-color: #4b8de6; }
  .ship-card.sel { border-color: var(--amber); transform: translateY(-6px);
    box-shadow: 0 0 0 1px #ffb23e66, 0 0 34px #ffb23e40, inset 0 0 40px #ffb23e14; }
  .ship-card .tab { display: none; position: absolute; top: 0; left: 50%; transform: translate(-50%, -100%);
    padding: 4px 34px 3px; background: #140d02; border: 2px solid var(--amber); border-bottom: 0;
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); color: #ffd59a; font-size: 15px; font-weight: 600;
    letter-spacing: .14em; white-space: nowrap; }
  .ship-card .tab::before { content: "\25BC  "; color: var(--amber); }
  .ship-card.sel .tab { display: block; }
  .art { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 12px 12px 0 0; }

  .ship-card.sel .art img { transform: scale(1.04); }
  .art::after { content: ""; position: absolute; inset: auto 0 0; height: 30%; background: linear-gradient(transparent, #050d1ce6); }
  .info { padding: 14px clamp(16px, 1.8vw, 26px) 16px; }
  .ttl { display: flex; align-items: baseline; gap: 12px; font-size: clamp(26px, 2.5vw, 38px); font-weight: 700; color: #fff; line-height: 1; }
  .ttl .no { color: #3ad7ff; }

  .crew { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 600;
    letter-spacing: .08em; color: #9fb4d6; }
  .crew svg { width: 15px; height: 15px; fill: #c9d6ea; }
  .crew b { color: #fff; font-size: 19px; }
  .cls { margin-top: 6px; padding-bottom: 12px; border-bottom: 1px solid #ffffff1f; font-size: 16px; font-weight: 500;
    letter-spacing: .5em; color: #c9d6ea; }
  .stats3 { margin-top: 8px; }
  .stat { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; align-items: center; gap: 12px; padding: 5px 0;
    font-size: 16px; font-weight: 600; letter-spacing: .06em; color: #dfe8fa; }
  .bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .bars i { height: 10px; border-radius: 2px; background: #182842; }
  .bars i.on { background: #3ad7ff; box-shadow: 0 0 6px #3ad7ff80; }
  .ship-card.sel .bars i.on { background: #ffc23e; box-shadow: 0 0 6px #ffb23e80; }
  .stat em { font-style: normal; text-align: right; color: #c9d6ea; }
  .perk { margin-top: 8px; font-family: "Noto Sans KR", sans-serif; font-size: 12.5px; color: #8ea3c6; }
  .sel-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .sel-foot button { font-family: inherit; cursor: pointer; }
  #selBack { justify-self: start; display: flex; align-items: center; gap: 12px; padding: 6px 14px 6px 6px; background: #050c18aa;
    border: 1px solid #ffffff22; border-radius: 8px; color: #dfe8fa; font-size: 17px; font-weight: 600; letter-spacing: .08em; }
  #selBack kbd, #selGo kbd { display: inline-grid; place-items: center; min-width: 34px; height: 30px; padding: 0 8px; box-sizing: border-box;
    border: 1.5px solid #c9d6ea88; border-radius: 6px; font-family: inherit; font-size: 15px; color: #fff; }
  .pager { display: flex; align-items: center; gap: 22px; padding: 8px 20px; border: 1px solid #ffffff30; border-radius: 6px;
    background: #050c18aa; font-size: 24px; font-weight: 600; letter-spacing: .08em; color: #8ea3c6; }
  .pager b { color: #fff; font-weight: 600; }
  .pager button { width: 0; height: 0; padding: 0; background: none; border: 0; border-top: 9px solid transparent;
    border-bottom: 9px solid transparent; }
  #selPrev { border-right: 12px solid #3ad7ff; } #selNext { border-left: 12px solid #3ad7ff; }
  #selGo { justify-self: end; display: flex; align-items: center; gap: 22px; padding: 10px 12px 10px 28px;
    background: linear-gradient(#1d1405, #0f0a02); border: 2px solid var(--amber); border-radius: 9px;
    box-shadow: 0 0 22px #ffb23e40, inset 0 0 12px #ffb23e22; color: #ffc65a; font-size: 22px; font-weight: 700; letter-spacing: .08em; }
  #selGo:hover { box-shadow: 0 0 30px #ffb23e70, inset 0 0 14px #ffb23e33; }
  #selGo kbd { border-color: #ffd59a; color: #ffd59a; }
  @media (max-width: 900px) {
    .sel-cards { grid-template-columns: minmax(0, 1fr); margin-top: 28px; }
    .ship-card:not(.sel) { display: none; }
    .sel-foot { grid-template-columns: auto auto; }
    .pager { grid-row: 1; grid-column: 1 / -1; justify-self: center; }
    #selGo { font-size: 18px; padding-left: 18px; }
  }

  @media (max-width: 960px) {
    .keys { display: none; }
    .dgrid { bottom: 14px; gap: 10px; }
    #obj { top: 70px; width: 230px; }
  }
  /* 터치 조작 */
  @supports (height: 100dvh) { :root { --win-h: calc(100dvh - var(--dash-h)); } }
  #touch, .touch-only, .touch-only-i { display: none; }
  body.touch #touch, body.touch .touch-only { display: block; }
  body.touch .touch-only-i { display: inline; }
  body.touch .key-only, body.touch .keys { display: none; }
  body.touch .dgrid { bottom: 14px; }
  body.touch .lever, body.touch #navScr { pointer-events: auto; touch-action: none; cursor: pointer; }
  .tc { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stick { left: max(18px, env(safe-area-inset-left)); top: calc(var(--win-h) - var(--stk) - 18px);
    width: var(--stk); height: var(--stk); border-radius: 50%;
    background: radial-gradient(circle, rgba(74, 168, 255, .12), rgba(8, 14, 28, .5) 70%);
    border: 1.5px solid rgba(160, 200, 255, .38); box-shadow: inset 0 0 20px rgba(0, 0, 0, .55); }
  #stick::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed rgba(160, 200, 255, .22); }
  #knob { position: absolute; left: 27%; top: 27%; width: 46%; height: 46%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6a7891, #1b2232 70%); border: 1.5px solid rgba(200, 225, 255, .65);
    box-shadow: 0 5px 12px #000b; }
  .tb { display: grid; place-items: center; padding: 0; width: 54px; height: 54px; border-radius: 50%;
    font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .08em; color: #dfe8fa;
    background: rgba(8, 14, 28, .55); border: 1.5px solid rgba(160, 200, 255, .38); backdrop-filter: blur(4px); }
  .tb.on { background: rgba(74, 168, 255, .38); border-color: #9fd0ff; }
  .tb svg { width: 24px; height: 24px; }
  #bFire { right: max(18px, env(safe-area-inset-right)); top: calc(var(--win-h) - 102px); width: 82px; height: 82px;
    font-size: 16px; color: #ffd6da; border-color: rgba(255, 106, 120, .75); background: rgba(70, 8, 18, .5); }
  #bFire.on { background: rgba(255, 74, 90, .5); }
  #bWarp { right: calc(max(18px, env(safe-area-inset-right)) + 96px); top: calc(var(--win-h) - 80px);
    color: #e6dcff; border-color: rgba(169, 139, 255, .75); background: rgba(34, 18, 70, .5); }
  #bWarp.on { background: rgba(169, 139, 255, .5); }
  #bRollL { right: calc(max(18px, env(safe-area-inset-right)) + 96px); top: calc(var(--win-h) - 146px); width: 48px; height: 48px; }
  #bRollR { right: calc(max(18px, env(safe-area-inset-right)) + 20px); top: calc(var(--win-h) - 162px); width: 48px; height: 48px; }
  #bThrUp, #bThrDn { left: calc(max(18px, env(safe-area-inset-left)) + var(--stk) + 16px); width: 46px; height: 46px; font-size: 22px; }
  #bThrUp { top: calc(var(--win-h) - 126px); } #bThrDn { top: calc(var(--win-h) - 72px); }

  /* 세로 화면(폰): 대시보드 2×2 */
  @media (max-width: 640px) and (orientation: portrait) {
    :root { --dash-h: 42vh; --stk: 112px; }
    .dgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; top: 16px; }
    .dgrid > :nth-child(1), .dgrid > :nth-child(2) { grid-column: span 3; }
    .dgrid > .gauges { grid-column: span 4; gap: 6px; }
    .dgrid > .eng { grid-column: span 2; padding: 26px 6px 8px 8px; gap: 6px; }
    .scr { border-width: 7px; }
    .g .gl { font-size: 11px; letter-spacing: .06em; }
    .g b { font-size: 15px; }
    .modes { font-size: 11px; }
    #toast { font-size: 18px; white-space: normal; width: 88vw; text-align: center; }
    #speedBox { transform: scale(.78); transform-origin: 0 0; top: 50px; left: 14px; }
    #wpn { transform: scale(.78); transform-origin: 0 0; top: 158px; left: 14px; }
    #obj { transform: scale(.78); transform-origin: 100% 0; top: 64px; right: 12px; }
    #brand { font-size: 13px; top: 14px; left: 14px; gap: 8px; }
    #brand svg { width: 26px; height: 18px; }
    #btns { top: 10px; right: 12px; }
    #btns button { width: 38px; height: 38px; }
    #reticle { transform: scale(.6); }
  }
  /* 낮은 가로 화면(폰 가로) */
  @media (max-height: 520px) {
    :root { --dash-h: 128px; --stk: 100px; }
    .dgrid { top: 12px; bottom: 8px !important; gap: 8px; }
    .scr { border-width: 6px; border-radius: 10px; }
    .sl, .sr { top: 5px; font-size: 11px; left: 10px; }
    .sr { left: auto; right: 10px; }
    .gauges { gap: 6px; }
    .g { gap: 1px; }
    .g .gl { font-size: 11px; }
    .g svg { width: min(72%, 13vh); }
    .g b { font-size: 14px; }
    .eng { padding: 22px 6px 6px 10px; gap: 6px; }
    .lever, .modes { min-height: 60px; }
    .modes { font-size: 11px; }
    #handle { height: 20px; }
    .keys { display: none; }
    #dash .lip { height: 16px; top: -12px; }
    #brand { font-size: 13px; top: 10px; left: 16px; gap: 8px; }
    #brand svg { width: 26px; height: 18px; }
    #speedBox { transform: scale(.66); transform-origin: 0 0; top: 38px; left: 16px; }
    #wpn { display: none; }
    #obj { transform: scale(.72); transform-origin: 100% 0; top: 54px; right: 14px; }
    #obj .oi { display: none; }
    #obj .oh { padding-bottom: 0; border-bottom: 0; margin-bottom: 0; }
    #btns { top: 8px; right: 14px; }
    #btns button { width: 38px; height: 38px; }
    #reticle { transform: scale(.6); }
    #toast { font-size: 20px; }
    .card { padding: 14px 18px; }
    .card h1 { font-size: 30px; }
    .card h2 { margin-bottom: 8px; }
    .card p { font-size: 12.5px; margin: 4px 0; }
    .tb { width: 48px; height: 48px; }
    #bFire { width: 70px; height: 70px; top: calc(var(--win-h) - 86px); }
    #bWarp { top: calc(var(--win-h) - 66px); right: calc(max(18px, env(safe-area-inset-right)) + 82px); }
    #bRollL { top: calc(var(--win-h) - 122px); right: calc(max(18px, env(safe-area-inset-right)) + 82px); width: 42px; height: 42px; }
    #bRollR { top: calc(var(--win-h) - 134px); width: 42px; height: 42px; }
    #bThrUp, #bThrDn { width: 42px; height: 42px; }
    #bThrUp { top: calc(var(--win-h) - 110px); } #bThrDn { top: calc(var(--win-h) - 62px); }
    /* 기체 선택 화면: 카드를 가로형으로 */
    #select { padding: 10px 16px 10px; }
    .sel-brand { font-size: 13px; }
    .sel-brand svg { width: 26px; height: 18px; }
    #select h1 { font-size: 22px; margin-top: 4px; }
    #select .sub, .perk { display: none; }
    #selSound { width: 38px; height: 38px; top: 10px; }
    .sel-cards { margin: 14px 0 10px; }
    .ship-card { flex-direction: row; }
    .ship-card.sel { transform: none; }
    .ship-card .tab { font-size: 12px; padding: 2px 22px; }
    .art { flex: 0 0 46%; border-radius: 12px 0 0 12px; }
    .art::after { display: none; }
    .info { flex: 1; min-width: 0; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; }
    .ttl { font-size: 22px; }
    .crew { font-size: 12px; } .crew b { font-size: 14px; }
    .cls { font-size: 11px; padding-bottom: 6px; letter-spacing: .35em; }
    .stat { grid-template-columns: 64px minmax(0, 1fr) 30px; gap: 8px; padding: 2px 0; font-size: 12px; }
    .bars i { height: 7px; }
    .pager { font-size: 17px; padding: 4px 14px; gap: 14px; }
    #selBack { font-size: 13px; }
    #selBack kbd, #selGo kbd { height: 24px; min-width: 28px; font-size: 12px; }
    #selGo { font-size: 15px; padding: 6px 8px 6px 16px; gap: 12px; }
    .sel-foot { grid-template-columns: 1fr auto 1fr; }
    .pager { grid-row: auto; grid-column: auto; }
  }

  /* ON-CALL 미션 */
  .card .missions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .card .mbtn { position: relative; text-align: left; padding: 12px 14px; margin: 0; border-radius: 10px;
    border: 1px solid #ffffff2a; background: #ffffff0a; }
  .card .mbtn b { display: block; font-family: Rajdhani, sans-serif; font-size: 20px; letter-spacing: .14em; color: #fff; }
  .card .mbtn span { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .card .mbtn i { position: absolute; top: 9px; right: 10px; font-style: normal; font-family: Rajdhani, sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: .1em; color: #120b02; background: var(--amber); border-radius: 4px; padding: 1px 6px; }
  .card .mbtn.on { border-color: var(--amber); background: #ffb23e1c; box-shadow: 0 0 0 1px #ffb23e55; }
  .card ol.brief { text-align: left; font-size: 13.5px; line-height: 1.75; color: #c9d6ea; padding-left: 22px; margin: 10px 0; }
  .card .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .card .acts button { margin: 0; text-align: left; font-size: 14px; padding: 11px 14px; }
  .card .acts button.no { opacity: .4; text-decoration: line-through; pointer-events: none; }
  .card .clue { text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; color: #dfe8fa;
    padding: 6px 10px; margin: 6px 0; background: #00000066; border: 1px solid #ffffff14; border-radius: 6px; }
  .card .clue b { color: var(--amber); font-weight: 600; }
  .card .fb { text-align: left; color: #ffc4c8; font-size: 13.5px; background: #ff4a5a1a; border: 1px solid #ff4a5a55;
    border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .card canvas#ocChart { width: 100%; height: 130px; display: block; margin: 10px 0 4px; }
  .card p.lg { font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .card .lvlink { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--blue); }
  .oclive { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ffffff14; }
  .ocrow { display: flex; align-items: baseline; gap: 12px; font-weight: 600; }
  .ocrow b { font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; }
  .ocrow span { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #ocSpark { display: block; width: 100%; height: 40px; margin-top: 6px; }
  .occlues div { font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.45; color: #c9d6ea; padding: 4px 0;
    border-top: 1px dashed #ffffff1a; }
  .occlues div b { color: var(--amber); font-weight: 600; }
  #lwLabels { position: absolute; inset: 0; display: none; }
  .lwl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; text-shadow: 0 1px 4px #000; }
  .lwl b { display: block; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #e9f1ff; }
  .lwl span { font-size: 12px; font-weight: 600; color: var(--dim); }
  .lwl.clue b { font-family: Rajdhani, sans-serif; font-size: 14px; letter-spacing: .1em; color: var(--teal); }
  .lwl.cc b { font-family: Rajdhani, sans-serif; font-size: 14px; letter-spacing: .12em; }
  @media (max-height: 520px) { #ocSpark, .occlues { display: none; } .oclive { margin-top: 0; padding-top: 0; border-top: 0; } }
</style>
</head>
<body>
<div id="hud">
  <div id="canopy"></div>
  <div id="warpfx"></div>
  <div id="warpflash"></div>
  <div id="lwLabels"></div>
  <svg id="frame" viewBox="0 0 1000 1000" preserveAspectRatio="none">
    <defs>
      <pattern id="strutTex" patternUnits="userSpaceOnUse" width="160" height="320">
        <image href="assets/strut-metal.webp" width="160" height="320" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <linearGradient id="strutShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset=".65" stop-color="#000" stop-opacity=".3"/>
        <stop offset="1" stop-color="#a9bcdc" stop-opacity=".16"/>
      </linearGradient>
    </defs>
    <polygon class="side" points="0,560 100,1000 0,1000"/>
    <polygon class="strut" points="0,400 30,380 150,1000 100,1000 0,560"/><polygon class="shade" points="0,400 30,380 150,1000 100,1000 0,560"/>
    <polyline class="edge" points="30,380 150,1000"/>
    <line class="stripGlow" x1="46" y1="540" x2="76" y2="700"/>
    <line class="strip" x1="46" y1="540" x2="76" y2="700"/>
    <g transform="translate(1000,0) scale(-1,1)">
      <polygon class="side" points="0,560 100,1000 0,1000"/>
      <polygon class="strut" points="0,400 30,380 150,1000 100,1000 0,560"/><polygon class="shade" points="0,400 30,380 150,1000 100,1000 0,560"/>
      <polyline class="edge" points="30,380 150,1000"/>
      <line class="stripGlow" x1="46" y1="540" x2="76" y2="700"/>
      <line class="strip" x1="46" y1="540" x2="76" y2="700"/>
    </g>
  </svg>

  <div id="brand">
    <svg viewBox="0 0 34 24" fill="none" stroke="#e9f1ff" stroke-width="1.8">
      <circle cx="17" cy="12" r="7"/><ellipse cx="17" cy="12" rx="15.5" ry="5" transform="rotate(-20 17 12)"/>
    </svg>
    <span>ORBIT / <span id="orbitNo">07</span></span><i></i><span class="mode" id="modeLbl">FREE FLIGHT</span>
  </div>
  <div id="speedBox" class="glass">
    <div class="lbl">SPEED</div>
    <div id="spd">0</div>
    <div class="unit">m/s</div>
    <div class="vbar"><i id="spdBar"></i></div>
  </div>
  <div id="wpn" class="glass">
    <div class="row"><span class="lbl">LASER</span><span id="wpnS">READY</span></div>
    <div class="hbar"><i id="heatBar"></i></div>
  </div>
  <div id="btns">
    <button class="glass" id="bPause" title="일시정지 (P)">
      <svg viewBox="0 0 20 20" fill="#fff"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
    </button>
    <button class="glass" id="bSet" title="설정">
      <svg viewBox="0 0 24 24" fill="#fff" fill-rule="evenodd"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </div>
  <div id="obj" class="glass">
    <div class="oh">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffb23e" stroke-width="2"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 8 16 12 12 16 8 12z" fill="#ffb23e"/></svg>
      DOCK AT STATION
    </div>
    <div class="oi" id="o1"><span class="ck"></span>항법 비컨 통과<em id="o1n">0/4</em></div>
    <div class="oi" id="o2"><span class="ck"></span>도킹 포트 접근<em>&lt; 120 m/s</em></div>
    <div class="oi kill"><span class="kx">✕</span>적 전투기 격추<em id="killN">0</em></div>
  </div>

  <svg id="reticle" viewBox="-320 -50 640 100" fill="none" stroke="#e9f1ff">
    <circle r="22" stroke-width="1.6"/><circle r="2.6" fill="#e9f1ff" stroke="none"/>
    <path d="M0-46V-30M0 30V46M-80 0H-44M44 0H80" stroke-width="1.6"/>
    <path d="M-300 0H-110M110 0H300" stroke-width="1" opacity=".45"/>
    <path d="M-250-5V5M250-5V5" stroke-width="1" opacity=".6"/>
  </svg>
  <div id="stn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 8 16 12 12 16 8 12z" fill="currentColor"/></svg>
    <span id="stnD"></span>
  </div>
  <div id="tgt">
    <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
    <div class="tl2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 8 16 12 12 16 8 12z" fill="currentColor"/></svg><span id="tgtD"></span></div>
  </div>
  <div id="emarks"></div>
  <div id="lead"></div>
  <svg id="hitm" viewBox="-22 -22 44 44" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M-16-16-9-9M16-16 9-9M-16 16-9 9M16 16 9 9"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// 유틸

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

const DEG = 180 / Math.PI;
function randomDir() {
  const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
  return new THREE.Vector3(r * Math.cos(t), r * Math.sin(t), u);
}
function glowTexture(stops, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), h = size / 2;
  const gr = g.createRadialGradient(h, h, 0, h, h, h);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
// 3D 값 노이즈 (행성 텍스처용)
function hash3(x, y, z, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177) ^ Math.imul(s, 1103515245);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, z, s) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi, s), hash3(xi + 1, yi, zi, s), u), l(hash3(xi, yi + 1, zi, s), hash3(xi + 1, yi + 1, zi, s), u), v),
    l(l(hash3(xi, yi, zi + 1, s), hash3(xi + 1, yi, zi + 1, s), u), l(hash3(xi, yi + 1, zi + 1, s), hash3(xi + 1, yi + 1, zi + 1, s), u), v),
    w);
}
function fbm(x, y, z, s, oct) {
  let sum = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, z * f, s + i * 17); f *= 2.03; a *= 0.5; }
  return sum / (1 - Math.pow(0.5, oct));
}

// =====================================================================
// 렌더러 / 카메라

const renderer = new THREE.WebGLRenderer({ antialias: true });

let dashH = 0;
const dpr = Math.min(devicePixelRatio, 2);
function fitCanvas(c) {
  const r = c.getBoundingClientRect();
  c.width = Math.max(1, r.width * dpr);
  c.height = Math.max(1, r.height * dpr);
  c._w = r.width; c._h = r.height;
}
function resize() {

}
addEventListener('resize', resize);

// =====================================================================
// 조명
// =====================================================================
const sunDir = new THREE.Vector3(0.62, 0.3, -0.72).normalize();
scene.add(new THREE.AmbientLight(0x40507a, 0.5));
const sunLight = new THREE.DirectionalLight(0xfff4e2, 1.35);
sunLight.position.copy(sunDir).multiplyScalar(100);

const fill = new THREE.DirectionalLight(0x3a6cff, 0.35);
fill.position.set(-1, -0.3, 0.4);

// =====================================================================
// 우주 배경 (카메라를 따라다니는 무한 원경)
// =====================================================================
const sky = new THREE.Group();
scene.add(sky);

function makeStars(dirs, size, radius, tint) {
  const n = dirs.length, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), c = new THREE.Color();
  dirs.forEach((d, i) => {
    pos.set([d.x * radius, d.y * radius, d.z * radius], i * 3);
    c.setHSL(tint ? rand(0.58, 0.66) : (Math.random() < 0.15 ? rand(0.05, 0.12) : rand(0.55, 0.68)), rand(0.2, 0.6), rand(0.55, 0.95));
    col.set([c.r, c.g, c.b], i * 3);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, fog: false }));
}
const starDirs = n => Array.from({ length: n }, randomDir);
sky.add(makeStars(starDirs(6500), 1.4, 7000));
sky.add(makeStars(starDirs(500), 2.6, 6990));
// 은하수 띠
const bandU = new THREE.Vector3(1, 0.35, 0.2).normalize();
const bandN = new THREE.Vector3(-0.2, 0.6, 0.75).normalize();
const bandV = new THREE.Vector3().crossVectors(bandN, bandU).normalize();
const bandDir = () => {
  const t = Math.random() * Math.PI * 2, s = (Math.random() + Math.random() + Math.random() - 1.5) * 0.14;
  return bandU.clone().multiplyScalar(Math.cos(t)).addScaledVector(bandV, Math.sin(t)).addScaledVector(bandN, s).normalize();
};
sky.add(makeStars(Array.from({ length: 6000 }, bandDir), 1.2, 6980, true));
for (let i = 0; i < 18; i++) {
  const t = i / 18 * Math.PI * 2;
  const col = ['#2f56c8', '#3b2f9e', '#1d6fc0'][i % 3];
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture([[0, col], [0.5, col + '44'], [1, col + '00']]),
    transparent: true, opacity: rand(0.18, 0.32), blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  s.position.copy(bandU.clone().multiplyScalar(Math.cos(t)).addScaledVector(bandV, Math.sin(t))).multiplyScalar(6500);
  const sc = rand(1800, 3000);
  s.scale.set(sc, sc, 1);
  sky.add(s);
}

// 태양
const sun = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture([[0, '#ffffff'], [0.08, '#fff6dc'], [0.25, '#ffc77a55'], [1, '#ff8a0000']]),
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true
}));
sun.position.copy(sunDir).multiplyScalar(6600);
sun.scale.set(1400, 1400, 1);
sky.add(sun);

// ----- 행성 (절차적 텍스처 + 낮/밤 셰이더) -----
function planetTextures() {
  const W = 1024, H = 512;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const dayC = mk(), nightC = mk(), cloudC = mk();
  const dayI = dayC.getContext('2d').createImageData(W, H);
  const nightI = nightC.getContext('2d').createImageData(W, H);
  const cloudI = cloudC.getContext('2d').createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const lat = (0.5 - (y + 0.5) / H) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let x = 0; x < W; x++) {
      const lon = (x + 0.5) / W * Math.PI * 2;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);
      const i = (y * W + x) * 4;
      const n = fbm(px * 1.8 + 5, py * 1.8, pz * 1.8, 3, 6);
      const ice = Math.abs(lat) > 1.22 + (n - 0.5) * 0.5;
      let r, g, b;
      if (n < 0.53) {
        const d = clamp((0.53 - n) * 7, 0, 1);
        r = 18 + (6 - 18) * d; g = 92 + (32 - 92) * d; b = 160 + (88 - 160) * d;
      } else {
        const h = clamp((n - 0.53) * 6, 0, 1);
        const m = vnoise(px * 6, py * 6, pz * 6, 9);
        r = 52 + 90 * m * (1 - h) + 40 * h; g = 88 + 40 * m * (1 - h) + 10 * h; b = 48 + 20 * m + 30 * h;
        if (n < 0.545) { r += 30; g += 25; b += 10; }
        // 도시 불빛
        const city = vnoise(px * 9, py * 9, pz * 9, 21) * 0.6 + vnoise(px * 40, py * 40, pz * 40, 23) * 0.4;
        if (!ice && city > 0.58 && Math.random() < (city - 0.58) * 1.4) {
          const k = rand(0.5, 1);
          nightI.data[i] = 255 * k; nightI.data[i + 1] = 176 * k; nightI.data[i + 2] = 92 * k;
        }
      }
      if (ice) { r = 225; g = 235; b = 245; }
      dayI.data[i] = r; dayI.data[i + 1] = g; dayI.data[i + 2] = b; dayI.data[i + 3] = 255;
      nightI.data[i + 3] = 255;
      const c = fbm(px * 3 + 40, py * 3 * 1.6, pz * 3, 11, 5);
      cloudI.data[i] = cloudI.data[i + 1] = cloudI.data[i + 2] = 255;
      cloudI.data[i + 3] = clamp((c - 0.5) * 4.5, 0, 0.95) * 255;
    }
  }
  dayC.getContext('2d').putImageData(dayI, 0, 0);
  nightC.getContext('2d').putImageData(nightI, 0, 0);
  cloudC.getContext('2d').putImageData(cloudI, 0, 0);
  return [dayC, nightC, cloudC].map(c => new THREE.CanvasTexture(c));
}
const [dayTex, nightTex, cloudTex] = planetTextures();
const PLANET_R = 1500;
const planet = new THREE.Group();
planet.position.set(-0.72, -0.36, -0.6).normalize().multiplyScalar(3050);
planet.rotation.set(0.25, -0.6, 0.35);
sky.add(planet);
const planetMat = new THREE.ShaderMaterial({
  uniforms: { dayMap: { value: dayTex }, nightMap: { value: nightTex }, sunDir: { value: sunDir } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() {
      vUv = uv;
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vP = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sunDir;
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() {
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vP);
      float d = dot(N, sunDir);
      float lit = smoothstep(-0.12, 0.3, d);
      vec3 col = texture2D(dayMap, vUv).rgb * (0.03 + 1.15 * max(d, 0.0));
      col += texture2D(nightMap, vUv).rgb * (1.0 - lit) * 1.1;
      float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
      col += vec3(0.25, 0.55, 1.0) * rim * (0.15 + lit * 1.1);
      gl_FragColor = vec4(col, 1.0);
    }`
});
planet.add(new THREE.Mesh(new THREE.SphereGeometry(PLANET_R, 96, 64), planetMat));
const clouds = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R * 1.008, 96, 64),
  new THREE.MeshLambertMaterial({ map: cloudTex, transparent: true, depthWrite: false, fog: false }));
planet.add(clouds);
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: sunDir } },
  vertexShader: `
    varying vec3 vN; varying vec3 vWN;
    void main() {
      vN = normalize(normalMatrix * normal);
      vWN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 sunDir; varying vec3 vN; varying vec3 vWN;
    void main() {
      float i = pow(max(0.0, 0.72 - dot(vN, vec3(0.0, 0.0, 1.0))), 3.0);
      float lit = smoothstep(-0.35, 0.4, dot(normalize(vWN), sunDir)) * 0.9 + 0.1;
      gl_FragColor = vec4(vec3(0.3, 0.6, 1.0) * i * lit * 1.6, 1.0);
    }`,
  side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false

planet.add(new THREE.Mesh(new THREE.SphereGeometry(PLANET_R * 1.07, 64, 48), atmoMat));

// 달
(function makeMoon() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#8d8f96'; g.fillRect(0, 0, 256, 128);

// =====================================================================
// 우주 정거장
// =====================================================================
const station = new THREE.Group();
const DOCK_LOCAL = new THREE.Vector3(0, 0, 66);
const blinkMats = [];
let dockLight;
(function buildStation() {
  const metal = new THREE.MeshStandardMaterial({ color: 0xa3adbd, metalness: 0.65, roughness: 0.42 });
  const darkM = new THREE.MeshStandardMaterial({ color: 0x2b3343, metalness: 0.6, roughness: 0.55 });

  add(new THREE.TorusGeometry(40, 1.5, 8, 80), darkM, [0, 3.6, 0], [H, 0, 0]);
  add(new THREE.TorusGeometry(46, 0.6, 6, 80), darkM, [0, -1, 0], [H, 0, 0]);

    add(new THREE.BoxGeometry(1.8, 0.9, 0.4), i % 4 ? winM : lightM,
      [Math.cos(a) * 43.3, 0, Math.sin(a) * 43.3], [0, H - a, 0]);
  }
  for (let k = 0; k < 4; k++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = k * H + Math.PI / 4;
    station.add(pivot);
    add(new THREE.CylinderGeometry(1.3, 1.3, 32, 8), darkM, [24, 0, 0], [0, 0, H], pivot);
  }
  add(new THREE.CylinderGeometry(9, 9, 16, 28), metal);
  add(new THREE.CylinderGeometry(6, 9, 6, 28), metal, [0, 11, 0]);
  add(new THREE.CylinderGeometry(4.5, 5.5, 26, 20), metal, [0, 27, 0]);
  add(new THREE.CylinderGeometry(2.6, 3.5, 18, 16), darkM, [0, 49, 0]);
  add(new THREE.CylinderGeometry(1.2, 2, 14, 12), metal, [0, 65, 0]);
  add(new THREE.CylinderGeometry(0.25, 0.25, 24, 6), darkM, [0, 84, 0]);
  for (const [x, z, h] of [[6.5, 0, 34], [-6.5, 0, 28], [0, -6.5, 40]]) {
    add(new THREE.CylinderGeometry(1.5, 1.8, h, 10), metal, [x, 14 + h / 2, z]);
    add(new THREE.CylinderGeometry(0.2, 0.2, 12, 5), darkM, [x, 20 + h, z]);
  }

    const a = rand(0, Math.PI * 2), y = rand(16, 58);
    const r = y < 40 ? 5.2 : 3.2;
    add(new THREE.BoxGeometry(0.8, 0.5, 0.2), winM, [Math.cos(a) * r, y, Math.sin(a) * r], [0, H - a, 0]);
  }
  add(new THREE.CylinderGeometry(5, 4, 24, 20), metal, [0, -20, 0]);
  add(new THREE.CylinderGeometry(2, 3, 16, 12), darkM, [0, -40, 0]);
  add(new THREE.CylinderGeometry(0.25, 0.25, 22, 6), darkM, [0, -58, 0]);

  const geo = new THREE.BufferGeometry(), p = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) { p.set([pos.x, pos.y, pos.z], i * 3); vel.push(randomDir().multiplyScalar(rand(0.2, 1) * speed)); }

function updateBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], arr = b.pts.geometry.attributes.position.array;
    b.life -= dt;
    b.vel.forEach((v, j) => { arr[j * 3] += v.x * dt; arr[j * 3 + 1] += v.y * dt; arr[j * 3 + 2] += v.z * dt; v.multiplyScalar(0.97); });
    b.pts.geometry.attributes.position.needsUpdate = true;

    if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }

}

function updateShip(dt, controlled) {

    if (state.invert) pi = -pi;
    yi = clamp((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0) - stickCurve(touchIn.x), -1, 1);
    ri = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0);
    if (keys.KeyW) state.throttle = Math.min(1, state.throttle + dt * 0.5);
    if (keys.KeyS) state.throttle = Math.max(0, state.throttle - dt * 0.5);
    state.boosting = (keys.ShiftLeft || keys.ShiftRight) && state.fuel > 0;
    if (state.fuel <= 0) state.throttle = 0;

  ship.rotateY(rate.y * dt);
  ship.rotateZ(rate.r * dt);

  state.warp = state.boosting ? Math.min(1, state.warp + dt * 1.4) : Math.max(0, state.warp - dt * 1.8);
  if (prevWarp < 0.04 && state.warp >= 0.04) warpEngage();

  const w = state.warp * state.warp * (3 - 2 * state.warp);
  const target = state.throttle * MAX_SPEED + BOOST * w;
  state.speed += (target - state.speed) * (1 - Math.exp(-dt * (state.boosting ? 2.2 : 1.2)));
  shipBasis();
  ship.position.addScaledVector(fwd, state.speed * dt);
}

function updateEnemies(dt) {

  if (state.spawnT <= 0) {

    const n = Math.min(cap - enemies.length, 2);
    if (n > 0 && !state.nearDock) {
      for (let k = 0; k < n; k++) spawnEnemy();
      toast(`⚠ HOSTILES INBOUND ×${n}`, '#ff5a5a');
      sfx('alarm');

    state.spawnT = rand(14, 22);
  }

function placeLabel(el, pos, dy) {
  const pr = project(pos), winH = innerHeight - dashH;
  if (pr.behind || pr.x < 0 || pr.x > innerWidth || pr.y < 0 || pr.y > winH) { el.style.display = 'none'; return false; }
  el.style.display = 'block';
  el.style.left = pr.x + 'px'; el.style.top = pr.y - dy + 'px';
  return pr;
}

const _ocM = new THREE.Matrix4();
function setupOncall() {
  applyWorld('oncall');
  ocS.n.fill(0); ocS.s5.fill(0); ocS.h.fill(0);
  Object.assign(oc, { simT: T_START, fixed: false, fixT: 0, incident: false, clues: 0, wrong: 0, tried: [], rescued: 0,
    lost: 0, success: 100, done: false, dockedOnce: false, feedback: '', lastM: 0 });
  state.budget = 100;
  state.navIdx = 2;
  ocClearParticles();
  while (debris.length) removeDebris(0);
  // 2분 분량의 과거 트래픽을 미리 채워 그래프가 비어 보이지 않게
  oc.simT = T_START - 600;
  for (let k = 0; k < 600; k++) { ocGenerate(1, false); oc.simT += 1; }
  state.budget = 100;

  const cp = ocPlanets[CHK].mesh.position;
  ship.position.set(420, 50, 260);
  _ocM.lookAt(ship.position, cp, new THREE.Vector3(0, 1, 0));
  ship.quaternion.setFromRotationMatrix(_ocM);
  const toShip = ship.position.clone().sub(cp).normalize();
  station.position.copy(cp).addScaledVector(toShip, ocPlanets[CHK].R + 180).add(new THREE.Vector3(0, 50, 0));
  station.lookAt(ship.position);
  station.rotateY(.45);
  station.updateMatrixWorld(true);
  dockWorld.copy(DOCK_LOCAL).applyMatrix4(station.matrixWorld);
  dockAxis.set(0, 0, 1).transformDirection(station.matrixWorld);

  clearBeacons();
  const start = ship.position.clone(), approach = dockWorld.clone().addScaledVector(dockAxis, 200);
  let prev = start;
  for (let i = 1; i <= 3; i++) {
    const t = i / 3.4;
    const pt = start.clone().lerp(approach, t).add(randomDir().multiplyScalar(110 * Math.sin(t * Math.PI)));
    buildBeacon(pt, pt.clone().sub(prev).normalize());
    prev = pt;
  }
  Object.assign(state, { beaconsPassed: 0, beaconsMissed: 0, missionT: 0 });
  $('ocClues').innerHTML = '';
}

// 프레임마다 (비행 중)
function ocUpdate(dt, now) {
  const spd = oc.fixed ? 45 : 20;
  const dtSim = dt * spd;
  ocGenerate(dtSim, true, now);
  oc.simT += dtSim;
  if (!oc.incident && oc.simT >= T_INC) {
    oc.incident = true;
    sfx('alarm'); flash();
    toast('⚠ INCIDENT · /api/checkout 5xx 급증', '#ff5a5a');
  }
  // 행성/항성 충돌
  for (const pl of ocPlanets) {
    const d = ship.position.distanceTo(pl.mesh.position);
    if (d < pl.R + 5) {
      tmpV.copy(ship.position).sub(pl.mesh.position).normalize();
      ship.position.copy(pl.mesh.position).addScaledVector(tmpV, pl.R + 7);
      state.speed *= .3;
      if (damagePlayer(14 + state.speed * .3, 'COLLISION')) return;
    }
  }
  if (ship.position.length() < 95) {
    ship.position.setLength(97); state.speed *= .3;
    if (damagePlayer(25, 'SOLAR FLARE')) return;
  }
  const st = ocStats(2);
  oc.success = (1 - st[CHK].e5) * 100;
  if (!oc.fixed) {
    if (state.budget <= 0) { ocFail('budget'); return; }
    if (oc.simT >= T_LIMIT) { ocFail('time'); return; }
  } else if (!oc.done && oc.simT - oc.fixT > 180 && st[CHK].e5 < .02) ocFinish();
}

// 매 프레임 (시각 효과)
function ocFrame(dt, now) {
  const st = ocStats(2);
  ocPlanets.forEach((pl, i) => {
    const o = st[i];
    pl.e5 = o.e5; pl.rpm = o.rpm;
    const hc = o.e5 > .1 ? 0xff4a5a : (o.e5 > .02 || o.p95 > 1500) ? 0xffb23e : 0x3ee6c1;
    pl.hc.lerp(new THREE.Color(hc), 1 - Math.exp(-dt * 3));
    pl.halo.material.color.copy(pl.hc);
    pl.halo.material.opacity = o.e5 > .1 ? .55 + .35 * Math.sin(now * 8) : .7;
    pl.mesh.rotation.y += dt * .05;
  });
  ocSunGlow.scale.setScalar(820 * (1 + .05 * Math.sin(now * 2.2)));
  // 입자
  for (let k = opAct.length - 1; k >= 0; k--) {
    const i = opAct[k], u = (now - opT0[i]) / opDur[i];
    if (u >= 1) {
      ocImpact(i);
      opCol.fill(0, i * 3, i * 3 + 3); otCol.fill(0, i * 6, i * 6 + 6);
      opAct[k] = opAct[opAct.length - 1]; opAct.pop(); opFree.push(i);
      continue;
    }
    const ue = u * u * (3 - 2 * u);
    ocBez(i, ue, _oa); ocBez(i, Math.max(0, ue - .06), _ob);
    opPos.set([_oa.x, _oa.y, _oa.z], i * 3);
    otPos.set([_oa.x, _oa.y, _oa.z, _ob.x, _ob.y, _ob.z], i * 6);
    const r = opRGB[i * 3], g = opRGB[i * 3 + 1], b = opRGB[i * 3 + 2];
    opCol.set([r, g, b], i * 3);
    otCol.set([r * .7, g * .7, b * .7, 0, 0, 0], i * 6);
  }
  opGeo.attributes.position.needsUpdate = opGeo.attributes.color.needsUpdate = true;
  otGeo.attributes.position.needsUpdate = otGeo.attributes.color.needsUpdate = true;
  for (const f of ocFlashes) if (f.life > 0) {
    f.life -= dt; if (f.life <= 0) { f.sp.visible = false; continue; }
    const k = f.life / .45; f.sp.material.opacity = k; f.sp.scale.setScalar(f.base * (1.4 - k * .4));
  }
  // 파편 공전 & 소멸
  const flying = state.mode === 'flying';
  for (let j = debris.length - 1; j >= 0; j--) {
    const d = debris[j], c = d.pl.mesh.position;
    if (flying) { d.ang += d.spd * dt; d.life -= dt; }
    d.mesh.position.set(c.x + Math.cos(d.ang) * d.rad, c.y + d.y, c.z + Math.sin(d.ang) * d.rad);
    d.mesh.rotation.x += dt * 2; d.mesh.rotation.y += dt * 1.3;
    if (d.life <= 0) {
      burst(d.mesh.position, 0xff4a5a, 16, 8, 0.6);
      removeDebris(j);
      oc.lost++;
      state.budget = Math.max(0, state.budget - .3);
    }
  }
  // 라벨
  ocPlanets.forEach((pl, i) => {
    tmpW.copy(pl.mesh.position); tmpW.y += pl.R;
    if (!placeLabel(ocPL[i], tmpW, 6)) return;
    const sp = ocPL[i].querySelector('span');
    sp.textContent = i === CHK && pl.e5 > .02 ? `5xx ${(pl.e5 * 100).toFixed(0)}%` : `${Math.round(pl.rpm).toLocaleString('en-US')}/m`;
    sp.style.color = pl.e5 > .1 ? 'var(--red)' : '';
  });
  ocClusters.forEach((c, i) => placeLabel(ocCL[i], c.pos, 40));
  ocBL.forEach((el, i) => {
    const b = beacons[i];
    if (!b) { el.style.display = 'none'; return; }
    el.querySelector('b').textContent = `CLUE #${oc.clues + i + 1}`;
    tmpW.copy(b.mesh.position); tmpW.y += BEACON_R + 4;
    placeLabel(el, tmpW, 4);
  });
}

function ocRadar(g, toRadar, R, range) {
  const p0 = toRadar(ocSun.position, false);
  if (p0) { g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(p0[0], p0[1], clamp(80 * R / range, 3, 12), 0, Math.PI * 2); g.fill(); }
  ocPlanets.forEach(pl => {
    const p = toRadar(pl.mesh.position, false);
    if (!p) return;
    g.fillStyle = '#' + pl.hc.getHexString();
    g.beginPath(); g.arc(p[0], p[1], clamp(pl.R * R / range, 2.5, 9), 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = '#ff4a5a';
  for (const d of debris) { const p = toRadar(d.mesh.position, false); if (p) g.fillRect(p[0] - 1.5, p[1] - 1.5, 3, 3); }
}

  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const m1 = clamp(Math.floor((oc.simT - 14 * 3600) / 60), 0, OC_MIN - 1), N = 20, bw = W / N;
  for (let k = 0; k < N; k++) {
    const m = m1 - N + 1 + k;
    if (m < 0) continue;
    const i = m * OC_NE + CHK, n = ocS.n[i], e = n ? ocS.s5[i] / n : 0;
    g.fillStyle = e > .1 ? '#ff4a5a' : e > .02 ? '#ffb23e' : '#3ee6c1';
    const h = Math.max(1.5, e * (H - 4));
    g.fillRect(k * bw + 1, H - h, bw - 2, h);
  }
  g.fillStyle = '#8ea3c6'; g.font = '600 10.5px Rajdhani, sans-serif'; g.textAlign = 'left';
  g.fillText('/api/checkout 5xx · 20분', 2, 10);
}

// ---------- 결과 ----------
function ocFinish() {
  oc.done = true;
  state.mode = 'result';
  const mttr = (oc.fixT - T_INC) / 60;
  const grades = ['S', 'A', 'B', 'C'];
  let gi = mttr <= 6 ? 0 : mttr <= 10 ? 1 : mttr <= 16 ? 2 : 3;
  gi = Math.min(3, gi + oc.wrong);
  // 조치 없음(가정): 14:35까지 장애 지속
  const shareChk = OC_EP[CHK].w;
  const rateAt = m => ocRate(14 * 3600 + m * 60 + 30) * 60 * shareChk;
  const inOut = m => { const t = 14 * 3600 + m * 60 + 30; return t >= T_INC && t < T_NATURAL; };
  const base = m => rateAt(m) * (inOut(m) ? .56 : .004);
  const act = m => m <= oc.lastM ? ocS.s5[m * OC_NE + CHK] : rateAt(m) * .004;
  let saved = 0;
  for (let m = 10; m < 35; m++) saved += Math.max(0, base(m) - act(m));
  saved = Math.round(saved * OC_SAMPLE + oc.rescued * OC_SAMPLE);
  showCard(`<h1>RESOLVED</h1><h2>결제 API 장애 복구 · 등급 ${grades[gi]}</h2>
    <canvas id="ocChart"></canvas>
    <p class="lg"><span style="color:#ff4a5a">■</span> 실제 결제 5xx / 분 &nbsp; <span style="color:#ffb4b4">┅</span> 조치하지 않았다면 (14:35까지 지속 가정)</p>
    <div class="stats"><div>MTTR<b>${mttr.toFixed(1)}분</b></div><div>지킨 요청<b>${saved.toLocaleString('en-US')}</b></div>
      <div>재시도 성공<b>${(oc.rescued * OC_SAMPLE).toLocaleString('en-US')}</b></div><div>BUDGET<b>${Math.round(state.budget)}%</b></div></div>
    <p>단서 ${oc.clues}/3 · 잘못된 조치 ${oc.wrong}회 · 롤백 시각 ${ocHHMMSS(oc.fixT).slice(0, 5)}</p>
    <button data-act="res-retry">다시 도전</button><button data-act="res-orbit">궤도 비행 모드</button>
    <br><a class="lvlink" href="logverse.html">LOGVERSE에서 하루 전체 로그 보기 ↗</a>`, true);
  requestAnimationFrame(() => drawResultChart(base, act, rateAt));
  sfx('warpOut');
}
function drawResultChart(base, act, rateAt) {
  const cv = $('ocChart');
  if (!cv) return;
  const W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const M = 45, top = 18, bot = H - 16, ch = bot - top;
  let mx = 1; for (let m = 0; m < M; m++) mx = Math.max(mx, base(m), act(m));
  const x = m => 6 + m / (M - 1) * (W - 12);
  // 실제 (막대)
  for (let m = 0; m < M; m++) {
    const v = act(m), h = v / mx * ch;
    g.fillStyle = v > rateAt(m) * .05 ? '#ff4a5a' : '#3ee6c1';
    g.fillRect(x(m) - 3, bot - h, 6, h);
  }
  // 조치 없음 (점선)
  g.strokeStyle = '#ffb4b4'; g.setLineDash([4, 4]); g.lineWidth = 1.5; g.beginPath();
  for (let m = 0; m < M; m++) { const y = bot - base(m) / mx * ch; m ? g.lineTo(x(m), y) : g.moveTo(x(m), y); }
  g.stroke(); g.setLineDash([]);
  // 롤백 시점
  const fm = (oc.fixT - 14 * 3600) / 60;
  g.strokeStyle = '#3ee6c1'; g.beginPath(); g.moveTo(x(fm), top - 4); g.lineTo(x(fm), bot); g.stroke();
  g.font = '600 11px Rajdhani, sans-serif'; g.fillStyle = '#3ee6c1'; g.textAlign = 'center';
  g.fillText('ROLLBACK', x(fm), top - 6);
  g.fillStyle = '#8ea3c6'; g.textAlign = 'left';
  [[0, '14:00', 'left'], [15, '14:15', 'center'], [30, '14:30', 'center'], [44, '14:45', 'right']].forEach(([m, l, a]) => { g.textAlign = a; g.fillText(l, x(m), H - 2); });
}
