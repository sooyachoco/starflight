const C = 251.3;
function setRing(id, valId, v, color) {
  const el = $(id);
  el.style.strokeDashoffset = C * (1 - v / 100);
  el.style.stroke = v < 25 ? 'var(--red)' : color;
  el.style.filter = `drop-shadow(0 0 4px ${v < 25 ? '#ff5a5a' : color})`;
  $(valId).textContent = Math.round(v) + '%';
}
function attitude() {
  const hdg = (Math.atan2(fwd.x, -fwd.z) * DEG + 360) % 360;
  const pitch = Math.asin(clamp(fwd.y, -1, 1)) * DEG;
  const roll = Math.atan2(right.y, up.y);
  return { hdg, pitch, roll };
}
function statusInfo() {
  if (state.mode !== 'flying') return ['STANDBY', '#8ea3c6'];
  if (state.hitT > 0) return ['DAMAGE', '#ff5a5a'];
  if (state.warp > 0.3) return ['WARP', '#a98bff'];
  if (state.mission === 'oncall' && state.nearDock) return ['DOCKING', '#ffb23e'];
  if (state.mission === 'oncall' && oc.incident && !oc.fixed) return ['INCIDENT', '#ff5a5a'];
  if (state.mission === 'oncall' && oc.fixed) return ['RECOVERING', '#3ee6c1'];
  if (state.prox) return ['PROXIMITY', '#ffb23e'];
  if (enemies.some(e => e.g.position.distanceTo(ship.position) < 600)) return ['COMBAT', '#ff5a5a'];
  if (state.nearDock) return ['DOCKING', '#ffb23e'];
  if (Math.abs(rate.p) + Math.abs(rate.y) + Math.abs(rate.r) > 0.3) return ['MANEUVER', '#4aa8ff'];
  return ['STABLE', '#3ee6c1'];
}

function drawNav() {
  const c = $('nav'), g = c.getContext('2d'), W = c._w, H = c._h;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 8, R = Math.max(10, Math.min(W, H - 16) / 2 - 12);
  const range = NAV_RANGES[state.navIdx];
  g.lineWidth = 1;
  g.strokeStyle = 'rgba(80,150,240,.45)';
  for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(cx, cy, R * k / 3, 0, Math.PI * 2); g.stroke(); }
  g.strokeStyle = 'rgba(80,150,240,.3)';
  g.beginPath(); g.moveTo(cx - R - 8, cy); g.lineTo(cx + R + 8, cy); g.moveTo(cx, cy - R - 8); g.lineTo(cx, cy + R + 8); g.stroke();
  // 스윕
  const sw = (performance.now() / 1600) % (Math.PI * 2);
  const grad = g.createLinearGradient(cx, cy, cx + Math.cos(sw) * R, cy + Math.sin(sw) * R);
  g.fillStyle = 'rgba(74,168,255,.12)';
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, sw - 0.5, sw); g.closePath(); g.fill();

  ship.updateMatrixWorld();
  const toRadar = (pos, clampEdge) => {
    const l = ship.worldToLocal(tmpV.copy(pos));
    let x = l.x / range * R, y = l.z / range * R;
    const m = Math.hypot(x, y);
    if (m > R) { if (!clampEdge) return null; x *= R / m; y *= R / m; }
    return [cx + x, cy + y, m > R];
  };
  if (state.mission === 'oncall' && ocWorld.visible) ocRadar(g, toRadar, R, range);
  g.fillStyle = 'rgba(160,190,230,.75)';
  if (!(state.mission === 'oncall' && ocWorld.visible)) for (const a of asteroids) {
    const p = toRadar(a.mesh.position, false);
    if (!p) continue;
    g.beginPath(); g.arc(p[0], p[1], clamp(1.2 + a.r * R / range * 0.8, 1.2, 6), 0, Math.PI * 2); g.fill();
  }
  beacons.forEach((b, i) => {
    const p = toRadar(b.mesh.position, i === 0);
    if (!p) return;
    g.fillStyle = i === 0 ? '#3ee6c1' : 'rgba(62,230,193,.45)';
    g.beginPath(); g.arc(p[0], p[1], i === 0 ? 4 : 3, 0, Math.PI * 2); g.fill();
  });
  for (const e of enemies) {
    const p = toRadar(e.g.position, true);
    g.fillStyle = '#ff4a5a';
    g.beginPath(); g.arc(p[0], p[1], p[2] ? 3 : 4, 0, Math.PI * 2); g.fill();
    if (!p[2]) { g.strokeStyle = 'rgba(255,74,90,.5)'; g.lineWidth = 1; g.beginPath(); g.arc(p[0], p[1], 7, 0, Math.PI * 2); g.stroke(); }
  }
  const sp = toRadar(dockWorld, true);
  g.save();
  g.translate(sp[0], sp[1]); g.rotate(Math.PI / 4);
  g.strokeStyle = '#ffb23e'; g.lineWidth = 2; g.strokeRect(-6, -6, 12, 12);
  g.fillStyle = '#ffb23e'; g.fillRect(-2.5, -2.5, 5, 5);
  g.restore();
  // 내 기체
  g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(cx, cy - 11); g.lineTo(cx + 8, cy + 7); g.lineTo(cx, cy + 3); g.lineTo(cx - 8, cy + 7); g.closePath(); g.fill();
  $('navRange').textContent = `R ${range / 100} km`;
}

function drawAtt(att, status) {
  const c = $('att'), g = c.getContext('2d'), W = c._w, H = c._h;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const cx = W / 2;
  // 헤딩
  g.textBaseline = 'alphabetic';
  const cp = H < 170;  // 낮은 화면에서는 압축 배치
  g.font = `600 ${cp ? 11 : 14}px Rajdhani, sans-serif`; g.fillStyle = '#b9c9e6'; g.textAlign = 'right';
  g.fillText('HDG', cx - 8, cp ? 14 : 24);
  g.font = `700 ${cp ? 15 : 22}px Rajdhani, sans-serif`; g.fillStyle = '#fff'; g.textAlign = 'left';
  g.fillText(String(Math.round(att.hdg) % 360).padStart(3, '0') + '°', cx, cp ? 15 : 25);
  const ty = cp ? 34 : 54, tw = Math.min(W * 0.72, 460), ppd = tw / 90;
  g.strokeStyle = 'rgba(200,220,255,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx - tw / 2, ty); g.lineTo(cx + tw / 2, ty); g.stroke();
  g.save(); g.beginPath(); g.rect(cx - tw / 2, ty - 30, tw, 34); g.clip();
  g.font = '600 13px Rajdhani, sans-serif'; g.textAlign = 'center';
  for (let d = Math.floor((att.hdg - 50) / 5) * 5; d <= att.hdg + 50; d += 5) {
    const x = cx + (d - att.hdg) * ppd, n = ((d % 360) + 360) % 360;
    g.strokeStyle = 'rgba(200,220,255,.7)';
    g.beginPath(); g.moveTo(x, ty); g.lineTo(x, ty - (n % 30 === 0 ? 10 : n % 10 === 0 ? 6 : 3)); g.stroke();
    if (n % 30 === 0 && !cp) { g.fillStyle = '#d8e4fa'; g.fillText(String(n).padStart(3, '0'), x, ty - 14); }
  }
  g.restore();
  g.fillStyle = '#ffb23e';
  g.beginPath(); g.moveTo(cx - 6, ty - 9); g.lineTo(cx + 6, ty - 9); g.lineTo(cx, ty - 1); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx, ty + 1); g.lineTo(cx + 4, ty + 5); g.lineTo(cx, ty + 9); g.lineTo(cx - 4, ty + 5); g.closePath(); g.fill();

  // 자세계 (ADI)
  const top = ty + (cp ? 8 : 18), bottom = H - (cp ? 22 : 36);
  const R = Math.max(20, Math.min((bottom - top) / 2, W * 0.22)), acy = (top + bottom) / 2;
  const k = R / 35;
  g.save();
  g.beginPath(); g.arc(cx, acy, R, 0, Math.PI * 2); g.clip();
  g.translate(cx, acy); g.rotate(att.roll); g.translate(0, att.pitch * k);
  let gr = g.createLinearGradient(0, -R * 2, 0, 0);
  gr.addColorStop(0, '#0b4f9c'); gr.addColorStop(1, '#2f8fe6');
  g.fillStyle = gr; g.fillRect(-R * 4, -R * 8, R * 8, R * 8);
  gr = g.createLinearGradient(0, 0, 0, R * 2);
  gr.addColorStop(0, '#16233a'); gr.addColorStop(1, '#0a1120');
  g.fillStyle = gr; g.fillRect(-R * 4, 0, R * 8, R * 8);
  g.strokeStyle = '#ffd08a'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-R * 4, 0); g.lineTo(R * 4, 0); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1;
  g.font = '600 10px Rajdhani, sans-serif'; g.fillStyle = 'rgba(255,255,255,.8)'; g.textAlign = 'left';
  for (let p = -80; p <= 80; p += 10) {
    if (!p) continue;
    const y = -p * k, w = p % 20 === 0 ? R * 0.42 : R * 0.22;
    g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y); g.stroke();
    if (p % 20 === 0) g.fillText(Math.abs(p), w / 2 + 4, y + 3);
  }
  g.restore();
  // 베젤 + 롤 눈금
  g.strokeStyle = 'rgba(200,220,255,.45)'; g.lineWidth = 1.2;
  g.beginPath(); g.arc(cx, acy, R, 0, Math.PI * 2); g.stroke();
  for (const a of [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60]) {
    const t = (a - 90) / DEG, l = a % 30 === 0 ? 9 : 5;
    g.beginPath();
    g.moveTo(cx + Math.cos(t) * R, acy + Math.sin(t) * R);
    g.lineTo(cx + Math.cos(t) * (R + l), acy + Math.sin(t) * (R + l));
    g.stroke();
  }
  g.save(); g.translate(cx, acy); g.rotate(att.roll);
  g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(0, -R + 2); g.lineTo(5, -R + 10); g.lineTo(-5, -R + 10); g.closePath(); g.fill();
  g.restore();
  // 기체 심볼
  g.strokeStyle = '#ffb23e'; g.fillStyle = '#ffb23e'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(cx - R * 0.62, acy); g.lineTo(cx - R * 0.2, acy); g.moveTo(cx + R * 0.2, acy); g.lineTo(cx + R * 0.62, acy); g.stroke();
  g.beginPath(); g.moveTo(cx, acy - 4); g.lineTo(cx + 9, acy + 9); g.lineTo(cx - 9, acy + 9); g.closePath(); g.fill();
  // 좌우 스케일 (속도 / 수직속도)
  const sx = Math.max(cx - tw / 2, cx - R - 70), ex = Math.min(cx + tw / 2, cx + R + 70);
  const sTop = acy - R, sH = R * 2;
  g.strokeStyle = 'rgba(200,220,255,.55)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(sx + 10, sTop); g.lineTo(sx, sTop); g.lineTo(sx, sTop + sH); g.lineTo(sx + 10, sTop + sH); g.stroke();
  g.beginPath(); g.moveTo(ex - 10, sTop); g.lineTo(ex, sTop); g.lineTo(ex, sTop + sH); g.lineTo(ex - 10, sTop + sH); g.stroke();
  for (let i = 1; i < 8; i++) {
    const y = sTop + sH * i / 8;
    g.beginPath(); g.moveTo(sx, y); g.lineTo(sx + (i % 2 ? 6 : 12), y); g.moveTo(ex, y); g.lineTo(ex - (i % 2 ? 6 : 12), y); g.stroke();
  }
  const spdY = sTop + sH * (1 - clamp(state.speed / (MAX_SPEED + BOOST), 0, 1));
  const vs = clamp(fwd.y * state.speed / MAX_SPEED, -1, 1);
  const vsY = acy - vs * R;
  g.fillStyle = '#3ee6c1';
  g.beginPath(); g.moveTo(sx + 3, spdY); g.lineTo(sx + 13, spdY - 5); g.lineTo(sx + 13, spdY + 5); g.closePath(); g.fill();
  g.fillStyle = '#4aa8ff';
  g.beginPath(); g.moveTo(ex - 3, vsY); g.lineTo(ex - 13, vsY - 5); g.lineTo(ex - 13, vsY + 5); g.closePath(); g.fill();
  g.font = '600 11px Rajdhani, sans-serif'; g.fillStyle = '#8ea3c6';
  if (!cp) {
    g.textAlign = 'left'; g.fillText('SPD', sx, sTop - 6);
    g.textAlign = 'right'; g.fillText('V/S', ex, sTop - 6);
  }
  // 상태 배지
  const [label, col] = status;
  g.font = `700 ${cp ? 10 : 13}px Rajdhani, sans-serif`; g.textAlign = 'center';
  const bh = cp ? 15 : 22, bw = Math.max(cp ? 64 : 86, g.measureText(label).width + (cp ? 18 : 30)), by = H - bh - (cp ? 4 : 6);
  g.fillStyle = col + '22'; g.strokeStyle = col; g.lineWidth = 1.2;
  g.beginPath();
  if (g.roundRect) g.roundRect(cx - bw / 2, by, bw, bh, 4); else g.rect(cx - bw / 2, by, bw, bh);
  g.fill(); g.stroke();
  g.fillStyle = col; g.fillText(label, cx, by + bh * 0.73);
}

const focal = () => (innerHeight + dashH) / 2 / Math.tan(camera.fov / 2 / DEG);
function project(pos) {
  tmpV.copy(pos).applyMatrix4(camera.matrixWorldInverse);
  const behind = tmpV.z > 0, dist = pos.distanceTo(camera.position);
  tmpW.copy(pos).project(camera);
  return { x: (tmpW.x + 1) / 2 * innerWidth, y: (1 - tmpW.y) / 2 * innerHeight, behind, dist };
}
function updateMarkers() {
  const winH = innerHeight - dashH, stn = $('stn'), tgt = $('tgt'), edge = $('edge');
  if (state.mode === 'title' || (state.mission === 'oncall' && oc.fixed)) { stn.style.display = tgt.style.display = edge.style.display = 'none'; return; }
  camera.updateMatrixWorld();
  const target = beacons[0] ? beacons[0].mesh.position : dockWorld;
  const isBeacon = !!beacons[0];
  const color = isBeacon ? '#3ee6c1' : '#ffb23e';
  const fmt = d => d * 10 >= 1000 ? (d / 100).toFixed(1) + ' km' : Math.round(d * 10) + ' m';
  const onWin = p => !p.behind && p.x > 30 && p.x < innerWidth - 30 && p.y > 30 && p.y < winH - 20;

  // 정거장 표식 (비컨이 목표일 때 보조 표시)
  const ps = project(station.position);
  if (isBeacon && onWin(ps)) {
    stn.style.display = 'block';
    stn.style.left = ps.x + 'px'; stn.style.top = ps.y + 'px';
    $('stnD').textContent = fmt(ps.dist);
  } else stn.style.display = 'none';

  const pt = project(target);
  if (onWin(pt)) {
    edge.style.display = 'none';
    tgt.style.display = 'block';
    tgt.style.color = color;
    const sz = clamp((isBeacon ? BEACON_R * 1.2 : 95) / pt.dist * focal() * 2, 34, 200);
    tgt.style.width = tgt.style.height = sz + 'px';
    tgt.style.left = pt.x + 'px'; tgt.style.top = pt.y + 'px';
    $('tgtD').textContent = fmt(pt.dist);
  } else {
    tgt.style.display = 'none';
    edge.style.display = 'block';
    const cx = innerWidth / 2, cy = winH / 2;
    let dx = pt.x - cx, dy = pt.y - cy;
    if (pt.behind) { dx = -dx; dy = -dy; if (Math.abs(dx) + Math.abs(dy) < 1) dy = 1; }
    const kk = Math.min((innerWidth / 2 - 60) / Math.abs(dx || 1e-6), (winH / 2 - 50) / Math.abs(dy || 1e-6));
    edge.style.left = cx + dx * kk + 'px';
    edge.style.top = cy + dy * kk + 'px';
    edge.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    edge.style.borderLeftColor = color;
    edge.style.filter = `drop-shadow(0 0 6px ${color})`;
  }
}

function updateEnemyMarkers() {
  const winH = innerHeight - dashH, lead = $('lead');
  let leadShown = false, bestDot = 0.9;
  shipBasis();
  const shipVel = fwd.clone().multiplyScalar(state.speed);
  for (const e of enemies) {
    const el = e.el, p = project(e.g.position);
    const onWin = !p.behind && p.x > 20 && p.x < innerWidth - 20 && p.y > 20 && p.y < winH - 10;
    el.style.display = 'block';
    if (onWin) {
      el.classList.remove('off');
      const sz = clamp(9 / p.dist * focal() * 2, 26, 110);
      el.style.width = el.style.height = sz + 'px';
      el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
      el.style.transform = 'translate(-50%, -50%)';
      el.querySelector('.d').textContent = Math.round(p.dist * 10) + ' m';
      el.querySelector('.hp i').style.width = e.hp + '%';
      // 리드(예측 사격) 표시: 조준선에 가장 가까운 적 하나
      tmpV.copy(e.g.position).sub(ship.position);
      const dot = tmpV.dot(fwd) / p.dist;
      if (p.dist < 700 && dot > bestDot) {
        bestDot = dot;
        const t = p.dist / BOLT_SPEED;
        const lp = project(tmpW.copy(e.vel).sub(shipVel).multiplyScalar(t).add(e.g.position));
        if (!lp.behind) { lead.style.left = lp.x + 'px'; lead.style.top = lp.y + 'px'; leadShown = true; }
      }
    } else {
      el.classList.add('off');
      el.style.width = el.style.height = '0px';
      const cx = innerWidth / 2, cy = winH / 2;
      let dx = p.x - cx, dy = p.y - cy;
      if (p.behind) { dx = -dx; dy = -dy; if (Math.abs(dx) + Math.abs(dy) < 1) dy = 1; }
      const kk = Math.min((innerWidth / 2 - 40) / Math.abs(dx || 1e-6), (winH / 2 - 30) / Math.abs(dy || 1e-6));
      el.style.left = cx + dx * kk + 'px'; el.style.top = cy + dy * kk + 'px';
      el.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    }
  }
  lead.style.display = leadShown && state.mode === 'flying' ? 'block' : 'none';
}

const modeEls = [...document.querySelectorAll('.modes li')];
function updateHud() {
  shipBasis();
  const spd = Math.round(state.speed * 10);
  $('spd').textContent = spd;
  $('spdBar').style.height = clamp(state.speed / (MAX_SPEED + BOOST), 0, 1) * 100 + '%';
  const ocm = ocWorld.visible;  // 화면에 보이는 월드 기준
  setRing('hullRing', 'hullV', ocm ? state.budget : state.hull, '#3ee6c1');
  setRing('shdRing', 'shdV', ocm ? oc.success : state.shield, '#4aa8ff');
  setRing('fuelRing', 'fuelV', state.fuel, '#ffb23e');
  const t = state.throttle;
  $('handle').style.top = `calc(${(1 - t) * 100}% - ${(1 - t) * 26}px)`;
  const lvls = [1, 0.66, 0.33, 0];
  let best = 0;
  lvls.forEach((l, i) => { if (Math.abs(t - l) < Math.abs(t - lvls[best])) best = i; });
  modeEls.forEach((el, i) => el.classList.toggle('on', i === best));
  $('modeLbl').textContent = shipDef.name + '  ·  ' + (ocm ? 'ON-CALL' : state.mode === 'docked' ? 'DOCKED' : state.warp > 0.3 ? 'WARP DRIVE' : state.nearDock ? 'APPROACH' : 'FREE FLIGHT');
  if (ocm) ocHud();
  else {
    const done = state.beaconsPassed + state.beaconsMissed;
    $('o1n').textContent = `${state.beaconsPassed}/${BEACON_N}`;
    $('o1').classList.toggle('done', done >= BEACON_N);
    $('o2').classList.toggle('done', state.mode === 'docked');
    $('killN').textContent = state.kills;
  }
  $('heatBar').style.width = state.heat + '%';
  $('heatBar').style.background = state.overheat ? 'var(--red)' : state.heat > 70 ? 'var(--amber)' : 'var(--blue)';
  $('wpnS').textContent = state.overheat ? 'OVERHEAT' : 'READY';
  $('wpnS').style.color = state.overheat ? 'var(--red)' : 'var(--teal)';
  drawNav();
  drawAtt(attitude(), statusInfo());
  updateMarkers();
  updateEnemyMarkers();
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now() / 1000;
  if (state.mode === 'flying') {
    state.missionT += dt;
    state.hitT = Math.max(0, state.hitT - dt);
    state.sinceHit += dt;
    if (state.sinceHit > 4) state.shield = Math.min(100, state.shield + dt * 3);
    updateShip(dt, true);
    playerFire(dt);
    updateBeacons();
    updateAsteroids(dt, true);
    if (state.mode === 'flying') updateEnemies(dt);
    if (state.mode === 'flying') updateBolts(dt);
    if (state.mode === 'flying') updateDocking();
    if (state.mode === 'flying' && state.mission === 'oncall' && ocWorld.visible) ocUpdate(dt, now);
    if (state.mode === 'flying' && state.fuel <= 0 && state.speed < 0.5) gameOver('OUT OF FUEL', '연료가 바닥나 우주를 표류하게 되었습니다.');
  } else if (state.mode === 'title') {
    updateShip(dt, false);
    updateAsteroids(dt, false);
  }
  if (state.mode !== 'paused') updateBursts(dt);
  if (ocWorld.visible) ocFrame(dt, now);
  updateCamera(dt);
  sky.position.copy(camera.position);
  clouds.rotation.y += dt * 0.004;
  blinkMats.forEach((m, i) => { m.visible = Math.sin(now * 3 + i * 1.7) > -0.3; });
  dockLight.color.setHSL(0.1, 1, 0.42 + 0.14 * Math.sin(now * 4));
  updateDust();
  updateHud();
  renderer.render(scene, camera);
}

    <span><kbd>Space</kbd></span><span>레이저 발사 (누르고 있으면 연사, 과열 주의)</span>
    <span><kbd>Shift</kbd></span><span>워프 부스트 (연료 소모 큼)</span>
    <span><kbd>M</kbd> · <kbd>P</kbd> · <kbd>I</kbd></span><span>NAV 범위 · 일시정지 · 상하 반전</span>
  </div>
  <div class="missions">
    <button class="mbtn${state.mission === 'orbit' ? ' on' : ''}" data-act="m-orbit"><b>ORBIT</b><span>궤도 비행 · 비컨 · 도킹 · 전투</span></button>
    <button class="mbtn${state.mission === 'oncall' ? ' on' : ''}" data-act="m-oncall"><i>NEW</i><b>ON-CALL</b><span>관제 파일럿 · 결제 API 장애 대응</span></button>
  </div>
  <div class="go"><span class="key-only">ENTER</span><span class="touch-only-i">TAP</span> — 기체 선택</div>`);
}
showTitle();
buildSelect();
loop();
</script>
</body>
</html>
